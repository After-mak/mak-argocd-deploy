name: Deploy Workflow

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Target Tag'
        required: true
        default: 'v1.2.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Deploy
        run: echo "Deploying tag ${{ github.event.inputs.target_tag }}"