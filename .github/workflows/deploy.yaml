name: FinOps Auto Deploy

on:
  workflow_dispatch:
    inputs:
      target_tag:          # 👈 main.py에서 보내는 키 이름과 100% 일치해야 함!
        description: 'Target Tag'
        required: true
        default: 'v1.2.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Script
        run: echo "Deploying ${{ github.event.inputs.target_tag }}"