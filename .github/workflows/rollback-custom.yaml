name: Rollback Pipeline

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Target Tag to Rollback'
        required: false  # 👈 false로 지정하여 target_tag 누락 시 422 에러 방지
        default: 'v1.1.0-stable'
      target_branch:
        description: 'Target Branch'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Update values.yaml via GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const filePath = 'charts/tg-gateway/values.yaml';
            
            // 💡 target_tag가 전달되지 않았으면 기본값('v1.1.0-stable') 사용
            const inputTag = '${{ github.event.inputs.target_tag }}';
            const targetTag = (inputTag && inputTag.trim() !== '') ? inputTag : 'v1.1.0-stable';
            const targetBranch = '${{ github.event.inputs.target_branch }}' || 'main';

            // 1. 최신 values.yaml 내용 조회
            const { data: fileData } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filePath,
              ref: targetBranch
            });

            // 2. tag 값 치환
            const currentContent = Buffer.from(fileData.content, 'base64').toString('utf8');
            const updatedContent = currentContent.replace(/tag:.*/g, `tag: "${targetTag}"`);

            if (currentContent === updatedContent) {
              console.log(`⚠️ 이미 ${targetTag} 버전으로 설정되어 있습니다.`);
              return;
            }

            // 3. API로 values.yaml만 수정을 커밋 (Git Push 미사용으로 권한/충돌 완벽 방지)
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filePath,
              message: `rollback: revert to ${targetTag}`,
              content: Buffer.from(updatedContent).toString('base64'),
              sha: fileData.sha,
              branch: targetBranch
            });

            console.log(`✅ [SUCCESS] 성공적으로 ${filePath}의 태그가 ${targetTag}(으)로 변경되었습니다.`);