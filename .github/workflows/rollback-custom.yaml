name: Rollback Custom Tag Pipeline

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Target Tag to Rollback'
        required: true
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'main'

jobs:
  rollback-custom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Clean Git and Apply Tag
        run: |
          git config --global user.name "FinOps Bot"
          git config --global user.email "bot@finops.local"

          # 1. 이전 꼬인 Git 인덱스 완벽 청소
          git reset --hard HEAD
          git clean -fd

          # 2. values.yaml 안의 tag만 치환
          sed -i "s/tag:.*/tag: \"${{ github.event.inputs.target_tag }}\"/g" charts/tg-gateway/values.yaml

          # 3. values.yaml 파일 단독 스테이징
          git add charts/tg-gateway/values.yaml

          # 4. 커밋 및 푸시
          if git diff --staged --quiet; then
            echo "⚠️ [INFO] 이미 해당 태그로 설정되어 있습니다."
          else
            git commit -m "rollback: revert to ${{ github.event.inputs.target_tag }}"
            git pull --rebase origin ${{ github.event.inputs.target_branch }}
            git push origin ${{ github.event.inputs.target_branch }}
            echo "✅ [SUCCESS] 성공적으로 태그 변경 후 푸시되었습니다."
          fi