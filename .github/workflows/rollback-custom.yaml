name: Rollback Custom Tag Pipeline

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Target Tag to Rollback'
        required: true
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'main'

# 💡 values.yaml 파일을 수정할 수 있는 기본 Write 권한 부여
permissions:
  contents: write

jobs:
  rollback-custom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update values.yaml via GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'charts/tg-gateway/values.yaml';
            const targetTag = '${{ github.event.inputs.target_tag }}';
            const targetBranch = '${{ github.event.inputs.target_branch }}';

            // 1. 로컬의 values.yaml 파일 읽기 및 tag 변경
            let content = fs.readFileSync(path, 'utf8');
            content = content.replace(/tag:.*/g, `tag: "${targetTag}"`);

            // 2. 현재 GitHub 원격 저장소의 values.yaml SHA 가져오기
            const { data: fileData } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: path,
              ref: targetBranch
            });

            // 3. GitHub API로 values.yaml만 직접 원격 커밋 (git push 미사용)
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: path,
              message: `rollback: revert to ${targetTag}`,
              content: Buffer.from(content).toString('base64'),
              sha: fileData.sha,
              branch: targetBranch
            });

            console.log(`✅ [SUCCESS] values.yaml이 성공적으로 ${targetTag} 버전으로 업데이트되었습니다.`);