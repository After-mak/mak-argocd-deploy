name: Rollback Custom Tag Pipeline

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Target Tag to Rollback'
        required: true
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'main'

permissions:
  contents: write

jobs:
  rollback-custom:
    runs-on: ubuntu-latest
    steps:
      - name: Update values.yaml via GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const filePath = 'charts/tg-gateway/values.yaml';
            const targetTag = '${{ github.event.inputs.target_tag }}';
            const targetBranch = '${{ github.event.inputs.target_branch }}';

            // 1. 원격 저장소에서 최신 values.yaml 파일 정보 가져오기
            const { data: fileData } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filePath,
              ref: targetBranch
            });

            // 2. 파일 내용 디코딩 후 tag 치환
            const currentContent = Buffer.from(fileData.content, 'base64').toString('utf8');
            const updatedContent = currentContent.replace(/tag:.*/g, `tag: "${targetTag}"`);

            if (currentContent === updatedContent) {
              console.log(`⚠️ 이미 ${targetTag} 버전으로 설정되어 있습니다.`);
              return;
            }

            // 3. GitHub API로 values.yaml만 단독 업데이트 (git push/commit 사용 안 함)
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filePath,
              message: `rollback: revert to ${targetTag}`,
              content: Buffer.from(updatedContent).toString('base64'),
              sha: fileData.sha,
              branch: targetBranch
            });

            console.log(`✅ [SUCCESS] 성공적으로 ${filePath}의 태그가 ${targetTag}(으)로 변경되었습니다.`);