name: Rollback Custom Tag Pipeline

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Target Tag to Rollback'
        required: true
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'main'

jobs:
  rollback-custom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Custom Tag
        run: |
          git config --global user.name "FinOps Bot"
          git config --global user.email "bot@finops.local"

          # 1. values.yaml의 태그만 변경
          sed -i "s/tag:.*/tag: \"${{ github.event.inputs.target_tag }}\"/g" charts/tg-gateway/values.yaml

          # 2. 🔥 중요: .github/ 폴더 안의 모든 변경사항/스테이징을 강제로 원복(Unstage & Restore)
          git restore --staged .github/ || true
          git checkout -- .github/ || true

          # 3. 🔥 오직 values.yaml 지정 파일만 단독 스테이징
          git add charts/tg-gateway/values.yaml

          # 4. values.yaml만 체크하여 커밋 & 푸시
          if git diff --staged --quiet; then
            echo "⚠️ [INFO] 이미 해당 태그로 설정되어 있어 변경사항이 없습니다."
          else
            git commit -m "rollback: revert to ${{ github.event.inputs.target_tag }}"
            git pull --rebase origin ${{ github.event.inputs.target_branch }}
            git push origin ${{ github.event.inputs.target_branch }}
            echo "✅ [SUCCESS] 성공적으로 태그 변경 후 GitOps 저장소에 푸시되었습니다."
          fi