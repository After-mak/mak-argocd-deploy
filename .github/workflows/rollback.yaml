name: Rollback HEAD Pipeline

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target Branch'
        required: true
        default: 'main'

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rollback Commit
        run: |
          git config --global user.name "FinOps Bot"
          git config --global user.email "bot@finops.local"
          git revert HEAD --no-edit
          git push origin ${{ github.event.inputs.target_branch }}