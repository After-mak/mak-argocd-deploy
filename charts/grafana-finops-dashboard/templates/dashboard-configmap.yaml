{{- $dashboardPath := printf "dashboards/%s" .Values.dashboard.fileName -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.dashboard.name }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{ .Values.dashboard.label }}: {{ .Values.dashboard.labelValue | quote }}
  annotations:
    grafana_folder: {{ .Values.dashboard.folder | quote }}
data:
  {{ .Values.dashboard.fileName }}: |
{{ required (printf "dashboard file %s is required" $dashboardPath) (.Files.Get $dashboardPath) | indent 4 }}
