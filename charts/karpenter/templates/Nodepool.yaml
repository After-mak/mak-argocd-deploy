# infra/karpenter/Nodepool.yaml
# 어떤 노드를 만들어낼지에 대한 규칙 정의
apiVersion: karpenter.sh/v1
kind: NodePool
# nodepool 이름
metadata:
  name: worker-nodepool
spec:
  template:
    metadata:
    # nodepool을 통해 만들어낼 노드에 붙일 라벨
      labels:
        node-role: worker
    spec:
      nodeClassRef:
        group: {{ .Values.karpenter_modulename }}
        kind: EC2NodeClass
        name: worker-nodepool
      requirements:
        - key: "{{ .Values.karpenter_modulename }}/instance-family"
          operator: In
          values: ["t3"]
        - key: "{{ .Values.karpenter_modulename }}/instance-size"
          operator: In
          values: ["small","medium"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          # value에 spot을 작성해서 spot instance도 사용할 수 있음
          values: ["on-demand"]
      expireAfter: 360h
  # 이 nodepool로 만드는 노드들의 총 cpu는 100코어까지 가능
  # memory는 100gb까지 가능  
  limits:
    cpu: 100
    memory: 100Gi
    # pod가 하나도 뜨지 않았거나 통신하지 않는 노드를 30초 후에 적용
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s