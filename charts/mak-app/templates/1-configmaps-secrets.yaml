apiVersion: v1
kind: ConfigMap
metadata:
  name: environment-config
  namespace: {{ .Release.Namespace | default "default" }}
data:
  LOCAL_ROUTING_NUM: "883745000"
  PUB_KEY_PATH: "/tmp/.ssh/publickey"
  ENABLE_TRACING: "false"
  DISABLE_TRACING: "1"
  DISABLE_PROFILER: "1"
  ENABLE_METRICS: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-api-config
  namespace: {{ .Release.Namespace | default "default" }}
data:
  TRANSACTIONS_API_ADDR: "ledgerwriter:8080"
  BALANCES_API_ADDR: "balancereader:8080"
  HISTORY_API_ADDR: "transactionhistory:8080"
  CONTACTS_API_ADDR: "contacts:8080"
  USERSERVICE_API_ADDR: "userservice:8080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-data-config
  namespace: {{ .Release.Namespace | default "default" }}
data:
  USE_DEMO_DATA: "True"
  DEMO_LOGIN_USERNAME: "testuser"
  DEMO_LOGIN_PASSWORD: "bankofanthos"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: accounts-db-config
  namespace: {{ .Release.Namespace | default "default" }}
data:
  # ACCOUNTS_DB_URI: postgresql://accounts-admin:accounts-pwd@accounts-db:5432/accounts-db
  ACCOUNTS_DB_URI: postgresql://project03-db-rw.default.svc.cluster.local:5432/app
  # POSTGRES_DB: accounts-db
  POSTGRES_DB: app
  # POSTGRES_PASSWORD: accounts-pwd
  # POSTGRES_USER: accounts-admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-db-config
  namespace: {{ .Release.Namespace | default "default" }}
data:
  # POSTGRES_DB: postgresdb
  POSTGRES_DB: app
  # POSTGRES_PASSWORD: password
  # POSTGRES_USER: admin
  # SPRING_DATASOURCE_PASSWORD: password
  # SPRING_DATASOURCE_URL: jdbc:postgresql://ledger-db:5432/postgresdb
  # SPRING_DATASOURCE_USERNAME: admin
  SPRING_DATASOURCE_URL: jdbc:postgresql://project03-db-rw.default.svc.cluster.local:5432/app
  SPRING_DATASOURCE_USERNAME: admin
  SPRING_DATASOURCE_PASSWORD: password
  # === 이 설정을 추가하여 테이블이 없으면 자동 생성 ===
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bank-of-anthos
  namespace: {{ .Release.Namespace | default "default" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: {{ .Release.Namespace | default "default" }}
type: Opaque
stringData:
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-key
  namespace: {{ .Release.Namespace | default "default" }}
type: Opaque
stringData:
  jwtRS256.key: |
    {{- .Values.secrets.jwtPrivateKey | nindent 4 }}
  jwtRS256.key.pub: |
    {{- .Values.secrets.jwtPublicKey | nindent 4 }}
