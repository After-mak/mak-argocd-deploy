{{- if .Values.components.backend -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
  namespace: {{ .Release.Namespace | default "default" }}
spec:
  selector:
    matchLabels:
      app: userservice
  template:
    metadata:
      labels:
        app: userservice
      annotations:
        # KRR 더미데이터/이력이 파드 이름에 묶여있어, Karpenter 노드 통합으로 파드가 자주
        # 교체되면 이력이 계속 무효화됩니다. 유휴 상태에서 불필요한 통합을 막기 위해 부착.
        karpenter.sh/do-not-disrupt: "true"
    spec:
      containers:
        - name: userservice
          #image: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/userservice:v0.6.10
          image: "{{ .Values.images.userservice }}"
          resources:
{{ toYaml .Values.resources.userservice.app | nindent 12 }}
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: TOKEN_EXPIRY_SECONDS
              value: "3600"
            - name: PRIV_KEY_PATH
              value: /tmp/.ssh/privatekey
          # === 이 부분을 추가해 주세요 ===         
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: project03-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project03-db-app
                  key: password
            - name: ACCOUNTS_DB_URI
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@project03-db-rw.backend.svc.cluster.local:5432/app"
            # ============================
          envFrom:
            - configMapRef:
                name: environment-config
            - configMapRef:
                name: accounts-db-config
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /tmp/.ssh
              name: keys
              readOnly: true
              #########################################
        - name: worker
          image: "{{ .Values.images.worker }}"
          command: ["python"]
          args: ["worker.py"]
          env:
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_DB
              value: {{ .Values.redis.db | quote }}
            - name: REDIS_SSL
              value: {{ .Values.redis.tlsEnabled | quote }}
            - name: REDIS_PASSWORD
              value: {{ .Values.redis.password | quote }}

            - name: REDIS_QUEUE_KEY
              value: "bank-userservice-queue"
            - name: TARGET_URL
              value: "http://localhost:8080"
            - name: WORKER_METRICS_PORT
              value: "9100"
          ports:
            - name: metrics
              containerPort: 9100
          resources:
{{ toYaml .Values.resources.userservice.worker | nindent 12 }}
           #########################################
      volumes:
        - emptyDir: {}
          name: tmp
        - name: keys
          secret:
            secretName: {{ required "secrets.existingSecret is required" .Values.secrets.existingSecret | quote }}
            items:
              - key: jwtRS256.key
                path: privatekey
              - key: jwtRS256.key.pub
                path: publickey
---
apiVersion: v1
kind: Service
metadata:
  name: userservice
  namespace: {{ .Release.Namespace | default "default" }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: userservice
