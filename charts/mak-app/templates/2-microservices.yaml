{{- if .Values.components.backend -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
  namespace: {{ .Release.Namespace | default "default" }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userservice
  template:
    metadata:
      labels:
        app: userservice
    spec:
      containers:
        - name: userservice
          #image: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/userservice:v0.6.10
          image: 372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_userservice_ecr:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: TOKEN_EXPIRY_SECONDS
              value: "3600"
            - name: PRIV_KEY_PATH
              value: /tmp/.ssh/privatekey
          # === 이 부분을 추가해 주세요 ===         
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: project03-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project03-db-app
                  key: password
            - name: ACCOUNTS_DB_URI
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@project03-db-rw.backend.svc.cluster.local:5432/app"
            # ============================
          envFrom:
            - configMapRef:
                name: environment-config
            - configMapRef:
                name: accounts-db-config
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /tmp/.ssh
              name: keys
              readOnly: true
              #########################################
        - name: worker
          image: 372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/sample-fastapi:v0.1.21
          command: ["python"]
          args: ["worker.py"]
          env:
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_DB
              value: {{ .Values.redis.db | quote }}
            - name: REDIS_SSL
              value: {{ .Values.redis.tlsEnabled | quote }}
            - name: REDIS_PASSWORD
              value: {{ .Values.redis.password | quote }}

            - name: REDIS_QUEUE_KEY
              value: "bank-userservice-queue"
            - name: TARGET_URL
              value: "http://localhost:8080"
            - name: WORKER_METRICS_PORT
              value: "9100"
          ports:
            - name: metrics
              containerPort: 9100
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
           #########################################
      volumes:
        - emptyDir: {}
          name: tmp
        - name: keys
          secret:
            secretName: jwt-key
            items:
              - key: jwtRS256.key
                path: privatekey
              - key: jwtRS256.key.pub
                path: publickey
---
apiVersion: v1
kind: Service
metadata:
  name: userservice
  namespace: {{ .Release.Namespace | default "default" }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: userservice
