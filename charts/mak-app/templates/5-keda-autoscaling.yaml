{{- if and .Values.components.backend .Values.autoscaling.backend.enabled }}
{{- $services := list "userservice" "contacts" "balancereader" "ledgerwriter" "transactionhistory" }}
{{- range $serviceName := $services }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $serviceName }}-scaler
  namespace: {{ $.Release.Namespace | default "default" }}
  labels:
    app: {{ $serviceName }}
spec:
  scaleTargetRef:
    name: {{ $serviceName }}
  pollingInterval: {{ $.Values.autoscaling.backend.pollingInterval }}
  cooldownPeriod: {{ $.Values.autoscaling.backend.cooldownPeriod }}
  minReplicaCount: {{ $.Values.autoscaling.backend.minReplicas }}
  maxReplicaCount: {{ $.Values.autoscaling.backend.maxReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ $.Values.autoscaling.backend.scaleDown.stabilizationWindowSeconds }}
          policies:
            - type: Pods
              value: 1
              periodSeconds: {{ $.Values.autoscaling.backend.scaleDown.periodSeconds }}
  triggers:
    # 큐 길이를 통한 KEDA 사후 대응(반응형) 오토스케일링 전용
    - type: redis
      name: queue
      metadata:
        # Terraform이 주입하는 ElastiCache 주소를 동적으로 사용
        address: {{ required "Redis host is required in values.yaml" $.Values.redis.host }}:{{ $.Values.redis.port }}
        listName: bank-{{ $serviceName }}-queue
        listLength: {{ $.Values.autoscaling.backend.redisListLength | quote }}
        enableTLS: {{ $.Values.redis.tlsEnabled | quote }}
        databaseIndex: {{ $.Values.redis.db | default "0" | quote }}
    - type: prometheus
      name: chronos2-scaling
      metricType: AverageValue
      metadata:
        serverAddress: {{ $.Values.autoscaling.backend.chronos.serverAddress | quote }}
        query: >-
          (max(chronos_scaling_replicas{deployment="{{ $serviceName }}"}) * max(chronos_forecast_valid{deployment="{{ $serviceName }}"}) * max((time() - chronos_forecast_timestamp_seconds{deployment="{{ $serviceName }}"}) < bool 120)) or vector(0)
        threshold: {{ $.Values.autoscaling.backend.chronos.threshold | quote }}
        activationThreshold: {{ $.Values.autoscaling.backend.chronos.activationThreshold | quote }}
    {{- if $.Values.autoscaling.backend.cpu.enabled }}
    # The Bank services are synchronous HTTP workloads; their Redis worker queues
    # stay empty during read/login traffic, so use app-container CPU as fallback.
    - type: prometheus
      name: http-cpu
      metricType: AverageValue
      metadata:
        serverAddress: {{ $.Values.autoscaling.backend.cpu.serverAddress | quote }}
        query: >-
          sum(rate(container_cpu_usage_seconds_total{namespace="{{ $.Release.Namespace | default "default" }}",pod=~"{{ $serviceName }}-.*",container="{{ $serviceName }}"}[1m])) or vector(0)
        threshold: {{ $.Values.autoscaling.backend.cpu.threshold | quote }}
        activationThreshold: {{ $.Values.autoscaling.backend.cpu.activationThreshold | quote }}
    {{- end }}
---
{{- end }}
{{- end }}
