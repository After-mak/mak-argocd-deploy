{{- if and .Values.components.frontend .Values.autoscaling.frontend.enabled }}
# Bank of Anthos frontend에 Chronos AI 선제적 스케일링을 적용합니다.
# frontend는 Deployment가 아닌 Argo Rollout이므로 scaleTargetRef에 Rollout 타입을 명시합니다.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: frontend-chronos-scaler
  namespace: {{ .Release.Namespace | default "default" }}
  labels:
    app: frontend
    scaler: chronos-predictive
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: mak-app-rollout
  pollingInterval: {{ .Values.autoscaling.frontend.pollingInterval }}
  cooldownPeriod: {{ .Values.autoscaling.frontend.cooldownPeriod }}
  minReplicaCount: {{ .Values.autoscaling.frontend.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.frontend.maxReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.autoscaling.frontend.scaleDown.stabilizationWindowSeconds }}
          policies:
            - type: Pods
              value: 1
              periodSeconds: {{ .Values.autoscaling.frontend.scaleDown.periodSeconds }}
  triggers:
    # Chronos AI 예측 기반 선제적 스케일링 트리거
    # Chronos가 Prometheus 시계열을 분석하여 향후 CPU 수요를 예측하고,
    # 필요한 replica 수를 chronos_scaling_replicas 메트릭으로 노출합니다.
    - type: prometheus
      name: chronos-predictive
      metricType: AverageValue
      metadata:
        serverAddress: {{ .Values.autoscaling.frontend.chronos.serverAddress | quote }}
        query: {{ .Values.autoscaling.frontend.chronos.query | quote }}
        threshold: {{ .Values.autoscaling.frontend.chronos.threshold | quote }}
        activationThreshold: {{ .Values.autoscaling.frontend.chronos.activationThreshold | quote }}
    {{- if .Values.autoscaling.frontend.cpu.enabled }}
    # Real HTTP traffic does not populate the waiting-room queue. Scale on absolute
    # frontend CPU as a request-independent reactive fallback for KRR PRE/POST runs.
    - type: prometheus
      name: frontend-http-cpu
      metricType: AverageValue
      metadata:
        serverAddress: {{ .Values.autoscaling.frontend.cpu.serverAddress | quote }}
        query: >-
          sum(rate(container_cpu_usage_seconds_total{namespace="{{ .Release.Namespace | default "default" }}",pod=~"mak-app-rollout-.*",container="mak-container"}[1m])) or vector(0)
        threshold: {{ .Values.autoscaling.frontend.cpu.threshold | quote }}
        activationThreshold: {{ .Values.autoscaling.frontend.cpu.activationThreshold | quote }}
    {{- end }}
    {{- if .Values.autoscaling.frontend.network.enabled }}
    # Network transmit rate follows successful HTTP response throughput and does
    # not create the startup-CPU feedback loop of an aggressive CPU target.
    - type: prometheus
      name: frontend-http-network
      metricType: AverageValue
      metadata:
        serverAddress: {{ .Values.autoscaling.frontend.network.serverAddress | quote }}
        query: >-
          sum(rate(container_network_transmit_bytes_total{namespace="{{ .Release.Namespace | default "default" }}",pod=~"mak-app-rollout-.*",interface!="lo"}[{{ .Values.autoscaling.frontend.network.window }}])) or vector(0)
        threshold: {{ .Values.autoscaling.frontend.network.threshold | quote }}
        activationThreshold: {{ .Values.autoscaling.frontend.network.activationThreshold | quote }}
    {{- end }}
    {{- if .Values.waitingRoom.enabled }}
    # Redis 대기열 길이 기반 반응형 스케일링 트리거
    - type: redis
      name: waiting-queue
      metadata:
        address: {{ required "Redis host required" .Values.redis.host }}:{{ .Values.redis.port }}
        listName: bank-frontend-waiting-queue
        listLength: {{ .Values.autoscaling.frontend.redisListLength | quote }}
        enableTLS: {{ .Values.redis.tlsEnabled | quote }}
        databaseIndex: {{ .Values.redis.db | default "0" | quote }}
    {{- end }}
---
{{- end }}
