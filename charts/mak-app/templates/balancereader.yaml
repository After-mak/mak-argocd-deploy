apiVersion: apps/v1
kind: Deployment
metadata:
  name: balancereader
  namespace: {{ .Release.Namespace | default "default" }}
spec:
  selector:
    matchLabels:
      app: balancereader
  template:
    metadata:
      labels:
        app: balancereader
    spec:
      containers:
      - name: balancereader
        image: gcr.io/bank-of-anthos-ci/balancereader:v0.5.11
        ports:
        - containerPort: 8080
        env:
        - name: VERSION
          value: "v0.5.11"
        - name: PORT
          value: "8080"
        - name: ENABLE_TRACING
          value: "false"
        envFrom:
        - configMapRef:
            name: environment-config
        - configMapRef:
            name: ledger-db-config
        volumeMounts:
        - name: jwt-key-vol
          mountPath: "/etc/jwt"
          readOnly: true
      volumes:
      - name: jwt-key-vol
        secret:
          secretName: jwt-key
---
apiVersion: v1
kind: Service
metadata:
  name: balancereader
  namespace: {{ .Release.Namespace | default "default" }}
spec:
  type: ClusterIP
  selector:
    app: balancereader
  ports:
  - port: 8080
    targetPort: 8080