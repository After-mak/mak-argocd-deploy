apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-db-init-script
  namespace: {{ .Release.Namespace | default "default" }}
data:
  0_init_tables.sql: |
    CREATE TABLE IF NOT EXISTS TRANSACTIONS (
        TRANSACTION_ID BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        from_accountNum CHAR(10) NOT NULL,
        to_accountNum CHAR(10) NOT NULL,
        from_routingNum CHAR(9) NOT NULL,
        to_routingNum CHAR(9) NOT NULL,
        amount BIGINT NOT NULL,
        timestamp TIMESTAMP NOT NULL
    );

    CREATE INDEX IF NOT EXISTS idx_transactions_from ON TRANSACTIONS (from_accountNum, from_routingNum, timestamp);
    CREATE INDEX IF NOT EXISTS idx_transactions_to ON TRANSACTIONS (to_accountNum, to_routingNum, timestamp);

    CREATE RULE PREVENT_UPDATE AS ON UPDATE TO TRANSACTIONS DO INSTEAD NOTHING;
    CREATE RULE PREVENT_DELETE AS ON DELETE TO TRANSACTIONS DO INSTEAD NOTHING;