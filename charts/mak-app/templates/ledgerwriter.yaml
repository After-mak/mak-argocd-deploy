apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerwriter
  namespace: {{ .Release.Namespace | default "default" }}
spec:
  selector:
    matchLabels:
      app: ledgerwriter
  template:
    metadata:
      labels:
        app: ledgerwriter
    spec:
      containers:
      - name: ledgerwriter
        image: gcr.io/bank-of-anthos-ci/ledgerwriter:v0.5.11
        ports:
        - containerPort: 8080
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "test-project"
        - name: GCP_PROJECT_ID
          value: "test-project"
        - name: VERSION
          value: "v0.5.11"
        - name: PORT
          value: "8080"
        - name: ENABLE_TRACING
          value: "false"
        - name: ENABLE_METRICS
          value: "false"
        - name: SPRING_CLOUD_GCP_CORE_ENABLED
          value: "false"
        - name: SPRING_CLOUD_GCP_LOGGING_ENABLED
          value: "false"
        - name: SPRING_CLOUD_GCP_METRICS_ENABLED
          value: "false"
        - name: SPRING_CLOUD_GCP_TRACE_ENABLED
          value: "false"
        - name: MANAGEMENT_TRACING_ENABLED
          value: "false"
        envFrom:
        - configMapRef:
            name: environment-config
        - configMapRef:
            name: service-api-config
        - configMapRef:
            name: ledger-db-config
        volumeMounts:
        - name: jwt-key-vol
          mountPath: "/etc/jwt"
          readOnly: true
      volumes:
      - name: jwt-key-vol
        secret:
          secretName: jwt-key
---
apiVersion: v1
kind: Service
metadata:
  name: ledgerwriter
  namespace: {{ .Release.Namespace | default "default" }}
spec:
  type: ClusterIP
  selector:
    app: ledgerwriter
  ports:
  - port: 8080
    targetPort: 8080