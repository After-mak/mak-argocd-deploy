apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: default # 인프라 담당자와 싱크 맞춰야할 네임스페이스
type: Opaque
stringData:
  # stringData를 사용하면 b64enc 없이 평문 그대로 써도 K8s가 자동 암호화
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-key
  namespace: default
type: Opaque
stringData:
  # ⚠️ 실제 키는 Git에 올리지 않고 주석 및 더미 값으로 가이드만 작성합니다.
  # 실제 키 주입 명령어: 
  # kubectl create secret generic jwt-key --from-file=jwtkey.pem --from-file=jwtcert.pem --dry-run=client -o yaml | kubectl apply -f -
  jwtkey.pem: "REPLACE_WITH_ACTUAL_PRIVATE_KEY"
  jwtcert.pem: "REPLACE_WITH_ACTUAL_PUBLIC_KEY"