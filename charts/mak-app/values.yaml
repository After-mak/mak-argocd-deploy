# 기본 애플리케이션 설정
replicaCount: 3
images:
  frontend: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_frontend_ecr:2.6"
  userservice: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_userservice_ecr:2.6"
  contacts: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_contacts_ecr:2.6"
  balancereader: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_balancereader_ecr:2.6"
  ledgerwriter: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_ledgerwriter_ecr:2.6"
  transactionhistory: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_transactionhistory_ecr:2.6"

image:
  pullPolicy: IfNotPresent
# 💡 패턴 분석 결과에 따라 깃허브 액션이 변경할 자원 권장값 영역
resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
service:
  type: ClusterIP
  port: 80
# Redis 연결 설정
redis:
  host: "redis" # K8s 내 Redis 서비스 이름 (또는 AWS ElastiCache 엔드포인트)
  port: 6379
  db: 0
  password: "redis" # Redis 비밀번호
  tlsEnabled: false # 로컬/K8s 내부는 false, ElastiCache TLS 사용 시 true
secrets:
  jwtPrivateKey: ""
  jwtPublicKey: ""
components:
  backend: true
  frontend: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_frontend_ecr:2.6"

# KEDA 기반 오토스케일링 설정
autoscaling:
  frontend:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    pollingInterval: 10
    cooldownPeriod: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      periodSeconds: 60
    chronos:
      serverAddress: "http://prometheus-stack-kube-prom-prometheus.prometheus.svc.cluster.local:9090"
      # Chronos가 default/frontend에 대해 예측한 스케일링 시그널을 KEDA가 소비합니다.
      # TTL(120s)과 valid 플래그를 PromQL에서도 검사해 Chronos Pod 중단 시 오래된 값이 남지 않게 합니다.
      query: >-
        (
          max(chronos_scaling_replicas{exported_namespace="default",deployment="frontend"})
          * max(chronos_forecast_valid{exported_namespace="default",deployment="frontend"})
          * max((time() - chronos_forecast_timestamp_seconds{exported_namespace="default",deployment="frontend"}) < bool 120)
        ) or vector(0)
      threshold: "1"
      activationThreshold: "0"