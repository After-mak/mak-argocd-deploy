# 기본 애플리케이션 설정
replicaCount: 3
images:
  frontend: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_frontend_ecr:3.1"
  userservice: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_userservice_ecr:2.7"
  contacts: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_contacts_ecr:2.7"
  balancereader: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_balancereader_ecr:2.7"
  ledgerwriter: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_ledgerwriter_ecr:2.7"
  transactionhistory: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_transactionhistory_ecr:2.7"
  worker: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/sample-fastapi:v0.1.22"

image:
  pullPolicy: IfNotPresent
# 패턴 분석 결과에 따라 깃허브 액션이 변경할 자원 권장값 영역
resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
service:
  type: ClusterIP
  port: 80
# Redis 연결 설정
redis:
  host: "master.project03-sample-redis.uuepdo.apn2.cache.amazonaws.com"
  port: 6379
  db: 0
  password: "" # Redis 비밀번호 (ElastiCache에 설정되지 않음)
  tlsEnabled: true # 로컬/K8s 내부는 false, ElastiCache TLS 사용 시 true
secrets:
  jwtPrivateKey: ""
  jwtPublicKey: ""
components:
  backend: true
  frontend: true