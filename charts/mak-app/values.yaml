# 기본 애플리케이션 설정
replicaCount: 3
images:
  frontend: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_frontend_ecr:3.2"
  userservice: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_userservice_ecr:3.2"
  contacts: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_contacts_ecr:3.2"
  balancereader: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_balancereader_ecr:3.2"
  ledgerwriter: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_ledgerwriter_ecr:3.2"
  transactionhistory: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_transactionhistory_ecr:3.2"
  worker: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/sample-fastapi:v0.1.22"
  loadgen: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_loadgen_ecr:v0.6.11"
image:
  pullPolicy: IfNotPresent
# 패턴 분석 결과에 따라 깃허브 액션이 변경할 자원 권장값 영역
resources:
  frontend:
    requests: {cpu: "140m", memory: "143Mi"}
    limits: {cpu: "500m", memory: "512Mi"}
  userservice:
    app:
      requests: {cpu: "140m", memory: "124Mi"}
      limits: {}
    worker:
      requests: {cpu: "204m", memory: "154Mi"}
      limits: {cpu: "500m", memory: "512Mi"}
  contacts:
    app:
      requests: {cpu: "140m", memory: "119Mi"}
      limits: {}
    worker:
      requests: {cpu: "154m", memory: "154Mi"}
      limits: {cpu: "500m", memory: "512Mi"}
  balancereader:
    app:
      requests: {cpu: "140m", memory: "370Mi"}
      limits: {}
    worker:
      requests: {cpu: "285m", memory: "154Mi"}
      limits: {cpu: "500m", memory: "512Mi"}
  ledgerwriter:
    app:
      requests: {cpu: "140m", memory: "307Mi"}
      limits: {}
    worker:
      requests: {cpu: "306m", memory: "154Mi"}
      limits: {cpu: "500m", memory: "512Mi"}
  transactionhistory:
    app:
      requests: {cpu: "140m", memory: "377Mi"}
      limits: {}
    worker:
      requests: {cpu: "265m", memory: "154Mi"}
      limits: {cpu: "500m", memory: "512Mi"}
service:
  type: ClusterIP
  port: 80
# Redis 연결 설정
redis:
  host: "master.project03-sample-redis.uuepdo.apn2.cache.amazonaws.com"
  port: 6379
  db: 0
  password: "" # Redis 비밀번호 (ElastiCache에 설정되지 않음)
  tlsEnabled: true # 로컬/K8s 내부는 false, ElastiCache TLS 사용 시 true
secrets:
  # JWT 키 본문은 이 Chart에 넣지 않습니다. Secret은 배포 전에 별도로 생성해야 합니다.
  # Secret에는 jwtRS256.key와 jwtRS256.key.pub가 있어야 합니다.
  existingSecret: "jwt-key"
components:
  backend: true
  frontend: true
# Frontend Waiting Room stays enabled by default and is disabled only for KRR experiments.
waitingRoom:
  enabled: false
# KEDA 기반 오토스케일링 설정
autoscaling:
  frontend:
    enabled: true
    # Sudden HTTP bursts must not start from a single frontend pod.
    minReplicas: 2
    maxReplicas: 10
    pollingInterval: 10
    cooldownPeriod: 60
    redisListLength: "20" # 대기자 20명당 pod 1개 증설
    slotsPerPod: "20" # pod 1개당 허용 동시 접속자 (frontend.py SLOTS_PER_POD과 동일하게 유지)
    userSessionTtl: "60" # 사용자 세션 TTL (초) - 이 시간 동안 활동 없으면 슬롯 반환
    scaleDown:
      stabilizationWindowSeconds: 300
      periodSeconds: 60
    chronos:
      serverAddress: "http://thanos-query.prometheus.svc.cluster.local:9090"
      query: >-
        (











          max(chronos_scaling_replicas{deployment="mak-app-rollout"})
          * max(chronos_forecast_valid{deployment="mak-app-rollout"})
          * max((time() - chronos_forecast_timestamp_seconds{deployment="mak-app-rollout"}) < bool 120)
        ) or vector(0)
      threshold: "1"
      activationThreshold: "0"
    # Absolute CPU target keeps PRE/POST scaling behavior independent of KRR request changes.
    cpu:
      enabled: true
      serverAddress: "http://prometheus-stack-kube-prom-prometheus.prometheus.svc.cluster.local:9090"
      threshold: "0.10"
      activationThreshold: "0.02"
    network:
      enabled: true
      serverAddress: "http://prometheus-stack-kube-prom-prometheus.prometheus.svc.cluster.local:9090"
      window: "1m"
      threshold: "150000"
      activationThreshold: "30000"
  backend:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    pollingInterval: 5
    cooldownPeriod: 60
    redisListLength: "2"
    chronos:
      serverAddress: "http://prometheus-stack-kube-prom-prometheus.prometheus.svc.cluster.local:9090"
      threshold: "1"
      activationThreshold: "0"
    cpu:
      enabled: true
      serverAddress: "http://prometheus-stack-kube-prom-prometheus.prometheus.svc.cluster.local:9090"
      threshold: "0.25"
      activationThreshold: "0.05"
# 유한 시간 Bank of Anthos k6 Job. runId 변경이 재실행 키이며 기본값은 배포하지 않음.
loadgen:
  enabled: true
  image: "grafana/k6:0.54.0"
  runId: "boa-smoke-30m-irate-20260824-1811"
  phase: "smoke"
  scenarioName: "boa-long-cycle-v1"
  scenarioVersion: "v1"
  profile: "smoke"
  timeScale: "1"
  cycles: "1"
  lowRps: "1"
  normalRps: "10"
  peakRps: "25"
  spikeRps: "40"
  recoveryRps: "3"
  maxVUs: "1500"
  requestTimeout: "10s"
  authMode: "shared"
  paymentPercent: "0"
  paymentAmount: "0.01"
  prometheusRemoteWriteEnabled: true
  prometheusRemoteWriteUrl: "http://prometheus-stack-kube-prom-prometheus.prometheus.svc.cluster.local:9090/api/v1/write"
  activeDeadlineSeconds: 90000
  persistence:
    claimName: "bank-loadgen-results"
    storageClassName: "ebs-gp3"
    size: "20Gi"
  credentialsSecret:
    name: "bank-loadgen-credentials"
    usernameKey: "username"
    passwordKey: "password"
    recipientAccountKey: "recipient-account"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1Gi
