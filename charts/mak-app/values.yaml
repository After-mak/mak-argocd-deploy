# 기본 애플리케이션 설정
replicaCount: 3
images:
  frontend: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_frontend_ecr:3.3"
  userservice: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_userservice_ecr:3.3"
  contacts: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_contacts_ecr:3.3"
  balancereader: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_balancereader_ecr:3.3"
  ledgerwriter: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_ledgerwriter_ecr:3.3"
  transactionhistory: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_transactionhistory_ecr:3.3"
  worker: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/sample-fastapi:v0.1.22"
  loadgen: "372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/mak_loadgen_ecr:v0.6.11"
image:
  pullPolicy: IfNotPresent
# 패턴 분석 결과에 따라 깃허브 액션이 변경할 자원 권장값 영역
resources:
  frontend:
    requests: {cpu: "175m", memory: "143Mi"}
    # Live POST에서 500m CFS quota의 p95 throttling이 30%까지 올라가
    # request는 KRR 권장값으로 유지하고 burst용 limit만 완화한다.
    limits: {cpu: "1000m", memory: "512Mi"}
  userservice:
    app:
      requests: {cpu: "175m", memory: "137Mi"}
      limits: {}
    worker:
      requests: {cpu: "300m", memory: "100Mi"}
      limits: {cpu: "500m", memory: "512Mi"}
  contacts:
    app:
      requests: {cpu: "200m", memory: "256Mi"}
      limits: {}
    worker:
      requests: {cpu: "250m", memory: "100Mi"}
      limits: {cpu: "500m", memory: "512Mi"}
  balancereader:
    app:
      # Java/Spring 서비스라 JVM 힙 기본 점유가 256Mi보다 높아(실측 p95 ~400Mi) memory도 함께 올림.
      requests: {cpu: "300m", memory: "400Mi"}
      limits: {}
    worker:
      requests: {cpu: "400m", memory: "100Mi"}
      limits: {cpu: "500m", memory: "512Mi"}
  ledgerwriter:
    app:
      requests: {cpu: "280m", memory: "387Mi"}
      limits: {}
    worker:
      requests: {cpu: "420m", memory: "100Mi"}
      limits: {cpu: "500m", memory: "512Mi"}
  transactionhistory:
    app:
      requests: {cpu: "350m", memory: "405Mi"}
      limits: {}
    worker:
      requests: {cpu: "380m", memory: "100Mi"}
      limits: {cpu: "500m", memory: "512Mi"}
service:
  type: ClusterIP
  port: 80
# Redis 연결 설정
redis:
  host: "master.project03-sample-redis.uuepdo.apn2.cache.amazonaws.com"
  port: 6379
  db: 0
  password: "" # Redis 비밀번호 (ElastiCache에 설정되지 않음)
  tlsEnabled: true # 로컬/K8s 내부는 false, ElastiCache TLS 사용 시 true
secrets:
  # JWT 키 본문은 이 Chart에 넣지 않습니다. Secret은 배포 전에 별도로 생성해야 합니다.
  # Secret에는 jwtRS256.key와 jwtRS256.key.pub가 있어야 합니다.
  existingSecret: "jwt-key"
components:
  backend: true
  frontend: true
# Frontend Waiting Room stays enabled by default and is disabled only for KRR experiments.
waitingRoom:
  enabled: true
# 라이브 트래픽 검증 중 Karpenter의 자발적 노드 통합으로 서비스 Pod가 축출되지 않도록 보호한다.
workloadPodAnnotations:
  karpenter.sh/do-not-disrupt: "true"
# Java 서비스의 Hikari 기본 pool(10)이 6개 Pod에서 DB 연결 60개를
# 상시 점유하므로 PostgreSQL max_connections=100 범위 안에서 여유를 둔다.
databasePool:
  java:
    maximumPoolSize: "2"
    minimumIdle: "1"
# KEDA 기반 오토스케일링 설정
autoscaling:
  frontend:
    enabled: true
    # Sudden HTTP bursts must not start from a single frontend pod.
    minReplicas: 2
    maxReplicas: 10
    pollingInterval: 10
    cooldownPeriod: 60
    redisListLength: "20" # 대기자 20명당 pod 1개 증설
    slotsPerPod: "20" # pod 1개당 허용 동시 접속자 (frontend.py SLOTS_PER_POD과 동일하게 유지)
    userSessionTtl: "60" # 사용자 세션 TTL (초) - 이 시간 동안 활동 없으면 슬롯 반환
    scaleDown:
      stabilizationWindowSeconds: 900
      periodSeconds: 60
    chronos:
      serverAddress: "http://thanos-query.prometheus.svc.cluster.local:9090"
      query: >-
        (
          max(chronos_scaling_replicas{deployment="mak-app-rollout"})
          * max(chronos_forecast_valid{deployment="mak-app-rollout"})
          * max((time() - chronos_forecast_timestamp_seconds{deployment="mak-app-rollout"}) < bool 120)
        ) or vector(0)
      threshold: "1"
      activationThreshold: "0"
    # Absolute CPU target keeps PRE/POST scaling behavior independent of KRR request changes.
    cpu:
      enabled: true
      serverAddress: "http://prometheus-stack-kube-prom-prometheus.prometheus.svc.cluster.local:9090"
      threshold: "0.10"
      activationThreshold: "0.02"
    network:
      enabled: true
      serverAddress: "http://prometheus-stack-kube-prom-prometheus.prometheus.svc.cluster.local:9090"
      window: "1m"
      threshold: "150000"
      activationThreshold: "30000"
  backend:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    pollingInterval: 5
    cooldownPeriod: 60
    redisListLength: "2"
    scaleDown:
      stabilizationWindowSeconds: 900
      periodSeconds: 60
    chronos:
      serverAddress: "http://prometheus-stack-kube-prom-prometheus.prometheus.svc.cluster.local:9090"
      threshold: "1"
      activationThreshold: "0"
    cpu:
      enabled: true
      serverAddress: "http://prometheus-stack-kube-prom-prometheus.prometheus.svc.cluster.local:9090"
      threshold: "0.25"
      activationThreshold: "0.05"
# 유한 시간 Bank of Anthos k6 Job. runId 변경이 재실행 키이며 기본값은 배포하지 않음.
loadgen:
  enabled: true
  image: "grafana/k6:0.54.0"
  runId: "boa-smoke-30m-irate-20260826-1818"
  phase: "smoke"
  scenarioName: "boa-long-cycle-v1"
  scenarioVersion: "v1"
  profile: "smoke"
  timeScale: "1"
  cycles: "1"
  lowRps: "1"
  normalRps: "500"
  peakRps: "700"
  spikeRps: "1100"
  recoveryRps: "350"
  maxVUs: "1500"
  requestTimeout: "10s"
  authMode: "none"
  # 잠시 none 으로 변경
  paymentPercent: "0"
  paymentAmount: "0.01"
  prometheusRemoteWriteEnabled: true
  prometheusRemoteWriteUrl: "http://prometheus-stack-kube-prom-prometheus.prometheus.svc.cluster.local:9090/api/v1/write"
  activeDeadlineSeconds: 90000
  # 장기 실행 중 Karpenter의 자발적 노드 통합으로 Job이 중단되지 않도록 보호한다.
  podAnnotations:
    karpenter.sh/do-not-disrupt: "true"
  persistence:
    claimName: "bank-loadgen-results"
    storageClassName: "ebs-gp3"
    size: "20Gi"
  credentialsSecret:
    name: "bank-loadgen-credentials"
    usernameKey: "username"
    passwordKey: "password"
    recipientAccountKey: "recipient-account"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1Gi
