{{- if .Values.worker.autoscaling.enabled }}
{{- $services := list "userservice" "contacts" "balancereader" "ledgerwriter" "transactionhistory" }}
{{- range $serviceName := $services }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $serviceName }}-scaler
  # 백엔드 마이크로서비스들이 위치한 네임스페이스에 배포되어야 하므로 하드코딩
  namespace: backend
  labels:
    app: {{ $serviceName }}
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    name: {{ $serviceName }}
  pollingInterval: {{ $.Values.worker.autoscaling.pollingInterval }}
  cooldownPeriod: {{ $.Values.worker.autoscaling.cooldownPeriod }}
  minReplicaCount: 1
  maxReplicaCount: 5
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ $.Values.worker.autoscaling.scaleDown.stabilizationWindowSeconds }}
          policies:
            - type: Pods
              value: 1
              periodSeconds: {{ $.Values.worker.autoscaling.scaleDown.periodSeconds }}
  triggers:
    # 사후 대응: 각 백엔드의 실제 Redis 큐 직접 모니터링 (테스트용 목표 길이: 2)
    - type: redis
      name: queue
      metadata:
        # Terraform이 주입하는 ElastiCache 주소를 동적으로 사용 (인프라 재생성 대응)
        address: {{ required "Redis host is required in values.yaml" $.Values.redis.host }}:{{ $.Values.redis.port }}
        listName: bank-{{ $serviceName }}-queue
        listLength: "2"
        enableTLS: "true"
        databaseIndex: "0"
---
{{- end }}
{{- end }}
