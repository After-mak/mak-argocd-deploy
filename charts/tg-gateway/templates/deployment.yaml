apiVersion: apps/v1
kind: Deployment
metadata:
  name: tg-gateway-deployment
  labels:
    {{- include "tg-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tg-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tg-gateway.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: GITHUB_REPO_OWNER
              value: {{ .Values.env.githubRepoOwner | quote }}
            - name: GITHUB_REPO_NAME
              value: {{ .Values.env.githubRepoName | quote }}
            - name: TARGET_BRANCH
              value: "main"  # 👈 하드코딩으로 main 지정!
            - name: GITOPS_TARGET_BRANCH
              value: "main"  # 👈 하드코딩으로 main 지정!
            - name: FINOPS_URL
              value: {{ .Values.env.finopsUrl | quote }}
            - name: TELEGRAM_BOT_TOKEN   # 👈 복구된 부분!
              valueFrom:
                secretKeyRef:
                  name: {{ include "tg-gateway.secretName" . }}
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "tg-gateway.secretName" . }}
                  key: TELEGRAM_CHAT_ID
            - name: GITOPS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "tg-gateway.secretName" . }}
                  key: GITOPS_TOKEN
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}