replicaCount: 1
image:
  repository: 372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/tg-gateway
  pullPolicy: Always
  tag: "v1.1.0-stable"
service:
  type: ClusterIP
  port: 8000
env:
  githubRepoOwner: "After-mak"
  githubRepoName: "mak-argocd-deploy"
  targetBranch: "main"
  finopsUrl: "http://finops-analyzer.finops.svc.cluster.local:8000"
# 텔레그램 봇 토큰/챗ID, GitHub PAT는 여기에 평문으로 넣지 않습니다.
# 아래 둘 중 하나를 사용하세요:
#   1) existingSecret에 미리 만들어둔 Secret 이름을 지정 (권장, GitOps로 커밋 가능)
#   2) values-secret.yaml.example을 values-secret.yaml로 복사해 실제 값을 채운 뒤
#      helm install -f values.yaml -f values-secret.yaml 로 배포 (values-secret.yaml은 .gitignore 처리됨)
secrets:
  existingSecret: "tg-gateway-secret"
  telegramBotToken: ""
  telegramChatId: ""
  gitopsToken: ""
resources:
  limits:
    cpu: 300m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi
